<body>

        <div tabindex="0" role="button" class="btn btn-square btn-ghost">

            class="inline-block h-5 w-5 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://spoo.me/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">
        My Portfolio
      </a>
    </div>
    <div class="navbar-end">
      <a href="https://spoo.me/jidnyeshresume" target="_blank"
        class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
    <div class="flex-none">
    </div>
  </div>
  <div class="flex flex-col items-center gap-2 pt-6 text-center px-4">
    <h1 class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">My
      Projects</h1>
    <p id="projects-count" class="text-sm opacity-60"></p>
  </div>

  <div class="py-4 px-4 md:px-6 max-w-7xl mx-auto w-full">
    <div class="px-4 pb-3">
      <label class="input input-bordered input-sm flex items-center gap-2 w-full sm:max-w-xs mx-auto">
        <i class="fa-solid fa-magnifying-glass opacity-60"></i>
        <input id="project-search" type="search" placeholder="Search projects, tags..." class="grow" autocomplete="off" />
      </label>
    </div>
    <div id="category-filters" class="flex flex-nowrap gap-2 overflow-x-auto scroll-px-4 pb-2 px-4 justify-start">
    </div>
  </div>

  <div class="py-8 px-4 md:px-8 max-w-7xl mx-auto w-full">
    <div id="projects-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-20 items-stretch"></div>
  </div>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    let allProjects = [];
    let activeCategory = 'All';
    let searchQuery = '';
    const FALLBACK_IMG = 'https://placehold.co/640x320?text=Project';

    const grid = document.getElementById('projects-grid');
    const filterContainer = document.getElementById('category-filters');
    const searchInput = document.getElementById('project-search');
    const countEl = document.getElementById('projects-count');

    // Loading skeletons
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card bg-base-100 shadow-sm border h-full overflow-hidden">
        <div class="skeleton h-48 w-full rounded-none"></div>
        <div class="card-body gap-2 p-5">
          <div class="skeleton h-5 w-3/4"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-5/6"></div>
        </div>
      </div>`).join('');

    fetch('projects.json')
      .then(res => {
        if (!res.ok) throw new Error('Failed to load projects.json');
        return res.json();
      })
      .then(projects => {
        allProjects = [...projects].sort((a, b) => (b.id ?? 0) - (a.id ?? 0));
        renderFilters(allProjects);
        applyFilters();
      })
      .catch(err => {
        console.error(err);
        grid.innerHTML = `
          <div class="col-span-full text-center py-16">
            <p class="text-lg font-semibold">Could not load projects.</p>
            <p class="text-sm opacity-60 mt-1">Please check your connection and refresh.</p>
          </div>`;
        if (countEl) countEl.textContent = '';
      });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderFilters(projects) {
      const counts = {};
      projects.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
      const categories = ['All', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];

      filterContainer.innerHTML = categories.map((category) => `
        <button
          type="button"
          data-category="${escapeHtml(category)}"
          aria-pressed="${category === activeCategory}"
          class="btn btn-sm whitespace-nowrap shrink-0 ${category === activeCategory ? 'btn-primary' : 'btn-outline'}"
        >
          ${escapeHtml(category)}
          <span class="badge badge-sm ${category === activeCategory ? 'badge-neutral' : 'badge-ghost'}">${category === 'All' ? projects.length : counts[category]}</span>
        </button>
      `).join('');

      filterContainer.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => filterByCategory(btn.dataset.category));
      });
    }

    function filterByCategory(category) {
      activeCategory = category;
      filterContainer.querySelectorAll('button').forEach(btn => {
        const isActive = btn.dataset.category === category;
        btn.setAttribute('aria-pressed', isActive);
        btn.classList.toggle('btn-primary', isActive);
        btn.classList.toggle('btn-outline', !isActive);
        const badge = btn.querySelector('.badge');
        if (badge) {
          badge.classList.toggle('badge-neutral', isActive);
          badge.classList.toggle('badge-ghost', !isActive);
        }
      });
      applyFilters();
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFilters();
      });
    }

    function applyFilters() {
      const byCategory = activeCategory === 'All'
        ? allProjects
        : allProjects.filter(p => p.category === activeCategory);

      const q = searchQuery;
      const filtered = q
        ? byCategory.filter(p =>
            [p.title, p.description, p.category, ...(p.tags || [])]
              .join(' ').toLowerCase().includes(q))
        : byCategory;

      renderProjects(filtered);
    }

    function statusBadgeClass(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('private')) return 'badge-warning';
      if (s.includes('progress') || s.includes('day')) return 'badge-secondary';
      return 'badge-info';
    }

    function renderProjects(projects) {
      if (countEl) {
        const total = allProjects.length;
        countEl.textContent = projects.length === total
          ? `${total} projects`
          : `${projects.length} of ${total} projects`;
      }

      if (!projects.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16">
            <p class="text-lg font-semibold">No projects found.</p>
            <p class="text-sm opacity-60 mt-1">Try a different search or category.</p>
            <button type="button" onclick="resetFilters()" class="btn btn-sm btn-outline mt-4">Clear filters</button>
          </div>`;
        return;
      }

      grid.innerHTML = projects.map(project => `
        <div class="card bg-base-100 shadow-sm border h-full flex flex-col overflow-hidden transition-all duration-200 hover:shadow-lg hover:-translate-y-1">
          ${project.link ? `
          <a href="${escapeHtml(project.link)}" target="_blank" rel="noopener noreferrer" class="group relative block h-48 overflow-hidden shrink-0">
            <img src="${escapeHtml(project.image_url)}" alt="${escapeHtml(project.title)}" loading="lazy"
              onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"
              class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
            <span class="badge badge-sm badge-neutral absolute top-3 left-3 opacity-90">${escapeHtml(project.category)}</span>
          </a>` : `
          <figure class="relative h-48 overflow-hidden shrink-0">
            <img src="${escapeHtml(project.image_url)}" alt="${escapeHtml(project.title)}" loading="lazy"
              onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"
              class="w-full h-full object-cover" />
            <span class="badge badge-sm badge-neutral absolute top-3 left-3 opacity-90">${escapeHtml(project.category)}</span>
          </figure>`}
          <div class="card-body flex flex-col flex-1 gap-2 p-5">
            <div class="flex items-start justify-between gap-2">
              ${project.link ? `
              <a href="${escapeHtml(project.link)}" target="_blank" rel="noopener noreferrer" class="flex-1 hover:underline">
                <h2 class="font-bold card-title text-base leading-snug select-text">
                  ${escapeHtml(project.title)}
                </h2>
              </a>` : `
              <h2 class="font-bold card-title text-base leading-snug flex-1 select-text">
                ${escapeHtml(project.title)}
              </h2>`}
              <div class="badge badge-outline badge-sm shrink-0 mt-1 select-text ${statusBadgeClass(project.status_badge)}">${escapeHtml(project.status_badge)}</div>
            </div>
            <p class="text-sm opacity-80 leading-relaxed select-text cursor-text">${escapeHtml(project.description)}</p>
            <div class="flex flex-wrap gap-1.5 pt-2 mt-auto select-text">
              ${(project.tags || []).map(tag => `<div class="badge badge-primary badge-sm">${escapeHtml(tag)}</div>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function resetFilters() {
      activeCategory = 'All';
      searchQuery = '';
      if (searchInput) searchInput.value = '';
      renderFilters(allProjects);
      applyFilters();
    }
  </script>
</body>

</html>
