<body>
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-none">

            class="inline-block h-5 w-5 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://kutt.it/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">
        My Portfolio
      </a>
    </div>
    <div class="navbar-end">
      <a href="https://kutt.it/jidnyeshresume" target="_blank"
        class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
    <div class="flex-none">

  </div>
  <div class="flex text-4xl justify-center">
    <button class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">My
      Projects</button>
  </div>

  <div class="py-4 px-2">
    <div id="category-filters" class="flex flex-nowrap gap-2 overflow-x-auto pb-2 px-4 justify-start md:justify-center">
    </div>
  </div>

  <div class="py-12">
    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-5 lg:grid-cols-3 gap-8 mb-12"></div>
  </div>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    let allProjects = [];

    fetch('projects.json')
      .then(res => res.json())
      .then(projects => {
        allProjects = projects;

        // Extract unique categories
        const categories = ['All', ...new Set(projects.map(p => p.category))];

        // Create category filter buttons
        const filterContainer = document.getElementById('category-filters');
        filterContainer.innerHTML = categories.map((category, index) => `
          <button 
            onclick="filterByCategory('${category}')" 
            class="btn btn-sm btn-outline ${index === 0 ? 'btn-primary' : ''} whitespace-nowrap"
          >
            ${category}
          </button>
        `).join('');

        // Render all projects initially
        renderProjects(projects);
      });

    function filterByCategory(category) {
      // Update button styles
      const buttons = document.querySelectorAll('#category-filters button');
      buttons.forEach(btn => {
        if (btn.textContent === category) {
          btn.classList.add('btn-primary');
          btn.classList.remove('btn-outline');
        } else {
          btn.classList.remove('btn-primary');
          btn.classList.add('btn-outline');
        }
      });

      // Filter projects
      const filtered = category === 'All'
        ? allProjects
        : allProjects.filter(p => p.category === category);

      renderProjects(filtered);
    }

    function renderProjects(projects) {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = projects.map(project => `
        <a href="${project.link}" target="_blank" rel="noopener noreferrer"
          class="card card-compact bg-base-100 shadow-sm border p-6">
          <figure>
            <img src="${project.image_url}" alt="${project.title}" />
          </figure>
          <div class="card-body">
            <h2 class="font-bold card-title">
              ${project.title}
              <div class="badge badge-outline badge-info whitespace-nowrap">${project.status_badge}</div>
            </h2>
            <p>${project.description}</p>
            <div class="py-4 card-actions justify-end">
              ${project.tags.map(tag => `<div class="badge badge-primary">${tag}</div>`).join('')}
            </div>
          </div>
        </a>
      `).join('');
    }
  </script>
</body>

</html>
