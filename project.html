<!DOCTYPE html>
<html lang="en" data-theme="sunset">

<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/regular.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="styles.css" rel="stylesheet" type="text/css" />
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <meta charset="UTF-8">
  <meta name="description"
    content="Jidnyesh Patil's Portfolio - DevOps and Cloud Enthusiast showcasing skills in Docker, Linux, Shell Scripting, Git, and GitHub.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects- Jidnyesh Patil</title>
</head>

<body>
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-none">
      <div class="dropdown">
        <div tabindex="0" role="button" class="btn btn-square btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-5 w-5 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://kutt.it/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">
        My Portfolio
      </a>
    </div>
    <div class="navbar-end">
      <a href="https://kutt.it/jidnyeshresume" target="_blank"
        class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
    <div class="flex-none">
    </div>
  </div>
  <div class="flex text-4xl justify-center">
    <button class="text-blue-500 btn btn-outline btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">My
      Projects</button>
  </div>

  <div class="py-12">
    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-5 lg:grid-cols-3 gap-8 mb-12"></div>
  </div>

  <style>
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--fallback-b1, oklch(var(--b1)/1));
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.25);
      z-index: 50;
    }

    .dock {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0.5rem 0.75rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .dock::-webkit-scrollbar {
      display: none;
    }

    .dock a {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--fallback-c, oklch(var(--bc)/1));
      font-size: 0.8rem;
      min-width: 60px;
    }

    .dock i {
      font-size: 1.1rem;
      margin-bottom: 3px;
    }

    .dock-label {
      font-size: 0.7rem;
      white-space: nowrap;
    }

    main {
      padding-bottom: 5.5rem;
    }
  </style>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    fetch('projects.json')
      .then(res => res.json())
      .then(projects => {
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = projects.map(project => `
          <a href="https://github.com/NOOBGLITCH" target="_blank" rel="noopener noreferrer"
            class="card card-compact bg-base-100 shadow-sm border p-6">
            <figure>
              <img src="${project.image_url}" alt="${project.title}" />
            </figure>
            <div class="card-body">
              <h2 class="font-bold card-title">
                ${project.title}
                <div class="badge badge-outline badge-info whitespace-nowrap">${project.status_badge}</div>
              </h2>
              <p>${project.description}</p>
              <div class="py-4 card-actions justify-end">
                ${project.tags.map(tag => `<div class="badge badge-primary">${tag}</div>`).join('')}
              </div>
            </div>
          </a>
        `).join('');
      });
  </script>
</body>

</html>
