<!DOCTYPE html>
<html lang="en" data-theme="sunset">

<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8" />
  <meta name="description"
    content="Jidnyesh Patil's Portfolio - DevOps and Cloud Enthusiast showcasing skills in Docker, Linux, Shell Scripting, Git, and GitHub.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - Jidnyesh Patil</title>
  <link href="styles.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js"></script>
</head>

<body>
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-none">
      <div class="dropdown">
        <button tabindex="0" class="btn btn-square btn-ghost">
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://kutt.it/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">My Portfolio</a>
    </div>
    <div class="navbar-end">
      <a href="https://kutt.it/jidnyeshresume" target="_blank"
        class="btn btn-soft text-blue-500 border-blue-500 btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
  </div>

  <main class="flex-grow">
    <section class="pt-6 mt-4 pb-16">
      <h1 class="text-3xl font-bold text-center mb-5">
        ✪ Certificates ✪
      </h1>

      <div class="py-4 px-2">
        <div id="category-filters"
          class="flex flex-nowrap gap-2 overflow-x-auto pb-2 px-4 justify-start md:justify-center">
        </div>
      </div>

      <div class="py-12">
        <div id="certificates-grid" class="grid grid-cols-1 md:grid-cols-5 lg:grid-cols-3 gap-8 mb-12"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    let allCertificates = [];

    // Set active dock tab
    const currentPage = window.location.pathname.split('/').pop() || 'certificates.html';
    document.querySelectorAll('.dock a').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPage || (currentPage === '' && href === 'index.html')) {
        link.classList.add('btn-active');
        link.style.color = 'var(--fallback-p, oklch(var(--p)/1))';
      }
    });

    // Helper for button styles (Active uses the orange theme from your image)
    function getBtnClasses(isActive) {
      const base = "px-4 py-2 rounded-xl border transition-all duration-300 font-bold text-sm whitespace-nowrap bg-transparent cursor-pointer ";
      const active = "border-[#ff6b4a] text-[#ff6b4a]";
      const inactive = "border-slate-700 text-slate-400 hover:border-slate-500 hover:text-white";
      return base + (isActive ? active : inactive);
    }

    // Initialize Page
    fetch('certificates.json')
      .then(res => res.json())
      .then(certificates => {
        allCertificates = certificates;

        const categories = ['All', ...new Set(certificates.map(c => c.category))];
        const filterContainer = document.getElementById('category-filters');

        filterContainer.innerHTML = categories.map((cat, index) => `
          <button onclick="filterCertificates('${cat}')" class="${getBtnClasses(index === 0)}">
            ${cat}
          </button>
        `).join('');

        renderCertificates(certificates);
      });

    function filterCertificates(category) {
      const buttons = document.querySelectorAll('#category-filters button');
      buttons.forEach(btn => {
        btn.className = getBtnClasses(btn.textContent.trim() === category);
      });

      const filtered = category === 'All'
        ? allCertificates
        : allCertificates.filter(c => c.category === category);

      renderCertificates(filtered);
    }

    function renderCertificates(certificates) {
      const grid = document.getElementById('certificates-grid');
      grid.innerHTML = certificates.map(cert => `
        <div class="card bg-base-100 shadow-xl border border-blue-500 hover:shadow-2xl hover:scale-[1.02] transition-all duration-300">
          <figure class="h-48 md:h-64 lg:h-80 flex items-center justify-center p-4 bg-slate-900/10">
            <img src="${cert.image_url}" alt="${cert.title}" class="max-w-full max-h-full object-contain rounded-lg" />
          </figure>
          <div class="card-body">
            <h2 class="card-title text-blue-500 leading-tight">${cert.title}</h2>
            <div class="badge badge-outline badge-info mb-2">${cert.category}</div>
            <p class="text-gray-500 text-sm">Issued by ${cert.issuer}</p>
            <div class="card-actions justify-end mt-4">
              <a href="${cert.view_url}" target="_blank" class="btn btn-primary btn-sm text-white">
                View Certificate
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>
</body>

</html>
