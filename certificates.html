<!DOCTYPE html>
<html lang="en" data-theme="sunset">

<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8" />
  <meta name="description"
    content="Jidnyesh Patil's Portfolio - DevOps and Cloud Enthusiast showcasing skills in Docker, Linux, Shell Scripting, Git, and GitHub.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - Jidnyesh Patil</title>
  <link href="styles.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js"></script>
</head>

<body>
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-none">
      <div class="dropdown">
        <button tabindex="0" class="btn btn-square btn-ghost">
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://kutt.it/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">My Portfolio</a>
    </div>
    <div class="navbar-end">
      <a href="https://kutt.it/jidnyeshresume" target="_blank"
        class="btn btn-soft text-blue-500 border-blue-500 btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
  </div>

  <main class="flex-grow">
    <section class="pt-6 mt-4 pb-16">
      <h1 class="text-3xl font-bold text-center mb-5">
        ✪ Certificates ✪
      </h1>

      <div class="container mx-auto px-4">
        <div id="certificates-grid" class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
      </div>
    </section>
  </main>

  <style>
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--fallback-b1, oklch(var(--b1)/1));
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.25);
      z-index: 50;
    }

    .dock {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0.5rem 0.75rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .dock::-webkit-scrollbar {
      display: none;
    }

    .dock a {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--fallback-c, oklch(var(--bc)/1));
      font-size: 0.8rem;
      min-width: 60px;
    }

    .dock i {
      font-size: 1.1rem;
      margin-bottom: 3px;
    }

    .dock-label {
      font-size: 0.7rem;
      white-space: nowrap;
    }

    main {
      padding-bottom: 5.5rem;
    }
  </style>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    fetch('certificates.json')
      .then(res => res.json())
      .then(certificates => {
        const grid = document.getElementById('certificates-grid');
        grid.innerHTML = certificates.map(cert => `
          <div class="card bg-base-100 shadow-xl border border-blue-500">
            <figure class="h-48 md:h-64 lg:h-80 flex items-center justify-center p-4">
              <img src="${cert.image_url}" alt="${cert.title}" class="max-w-full max-h-full object-contain rounded-lg" />
            </figure>
            <div class="card-body">
              <h2 class="card-title text-blue-500">${cert.title}</h2>
              <p class="text-gray-500">Issued by ${cert.issuer}</p>
              <div class="card-actions justify-end">
                <a href="${cert.view_url}" target="_blank" class="text-white dark:text-white btn btn-primary btn-sm">
                  View Certificate
                </a>
              </div>
            </div>
          </div>
        `).join('');
      });
  </script>
</body>

</html>
