<!DOCTYPE html>
<html lang="en" data-theme="sunset">

<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8" />
  <meta name="description"
    content="Jidnyesh Patil's Portfolio - DevOps and Cloud Enthusiast showcasing skills in Docker, Linux, Shell Scripting, Git, and GitHub.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - Jidnyesh Patil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="styles.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="navbar bg-base-100 shadow-sm">
    <div class="flex-none">
      <div class="dropdown">
        <button tabindex="0" class="btn btn-square btn-ghost">
          <i class="fa-solid fa-bars"></i>
        </button>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
          <li><a href="index.html">Home</a></li>
          <li><a href="aboutme.html">About me</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="certificates.html">Certificates</a></li>
          <li><a href="https://spoo.me/jidnyeshresume" target="_blank">Resume</a></li>
        </ul>
      </div>
    </div>
    <div class="flex-1">
      <a href="index.html" class="btn btn-ghost text-xl">My Portfolio</a>
    </div>
    <div class="navbar-end">
      <a href="https://spoo.me/jidnyeshresume" target="_blank"
        class="btn btn-soft text-blue-500 border-blue-500 btn-lg hover:shadow-lg hover:scale-105 transition-all duration-200">Resume📋</a>
    </div>
  </div>

  <main class="flex-grow pb-24">
    <section class="pt-6 mt-4">
      <h1 class="text-3xl font-bold text-center mb-1">
        ✪ Certificates ✪
      </h1>
      <p id="certificates-count" class="text-sm opacity-60 text-center mb-2"></p>

      <div class="py-4 px-4 md:px-6 max-w-7xl mx-auto w-full">
        <div class="pb-3">
          <label class="input input-bordered input-sm flex items-center gap-2 w-full sm:max-w-xs mx-auto">
            <i class="fa-solid fa-magnifying-glass opacity-60"></i>
            <input id="certificate-search" type="search" placeholder="Search certificates, tags..." class="grow" autocomplete="off" />
          </label>
        </div>
        <div id="category-filters"
          class="flex flex-nowrap gap-2 overflow-x-auto scroll-px-4 pb-2 px-4 justify-start">
        </div>
      </div>

      <div class="py-8 px-4 md:px-8 max-w-7xl mx-auto w-full">
        <div id="certificates-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="dock">
      <a href="index.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-house"></i>
        <span class="dock-label">Home</span>
      </a>

      <a href="project.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-code"></i>
        <span class="dock-label">Projects</span>
      </a>

      <a href="aboutme.html" class="flex flex-col items-center justify-center">
        <i class="fa-regular fa-circle-user"></i>
        <span class="dock-label">About Me</span>
      </a>

      <a href="certificates.html" class="flex flex-col items-center justify-center">
        <i class="fa-solid fa-envelope-circle-check"></i>
        <span class="dock-label">Certificates</span>
      </a>
    </div>
  </footer>

  <script>
    let allCertificates = [];
    let activeCategory = 'All';
    let searchQuery = '';
    const FALLBACK_IMG = 'https://placehold.co/640x360?text=Certificate';

    const grid = document.getElementById('certificates-grid');
    const filterContainer = document.getElementById('category-filters');
    const searchInput = document.getElementById('certificate-search');
    const countEl = document.getElementById('certificates-count');

    // Loading skeletons
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card bg-base-100 shadow-sm border h-full overflow-hidden">
        <div class="skeleton h-56 w-full rounded-none"></div>
        <div class="card-body gap-2 p-5">
          <div class="skeleton h-5 w-3/4"></div>
          <div class="skeleton h-4 w-1/3"></div>
          <div class="skeleton h-4 w-5/6"></div>
        </div>
      </div>`).join('');

    // Initialize Page
    fetch('certificates.json')
      .then(res => {
        if (!res.ok) throw new Error('Failed to load certificates.json');
        return res.json();
      })
      .then(certificates => {
        allCertificates = [...certificates].sort((a, b) => (b.id ?? 0) - (a.id ?? 0));
        renderFilters(allCertificates);
        applyFilters();
      })
      .catch(err => {
        console.error(err);
        grid.innerHTML = `
          <div class="col-span-full text-center py-16">
            <p class="text-lg font-semibold">Could not load certificates.</p>
            <p class="text-sm opacity-60 mt-1">Please check your connection and refresh.</p>
          </div>`;
        if (countEl) countEl.textContent = '';
      });

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderFilters(certificates) {
      const counts = {};
      certificates.forEach(c => { counts[c.category] = (counts[c.category] || 0) + 1; });
      const categories = ['All', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];

      filterContainer.innerHTML = categories.map((category) => `
        <button
          type="button"
          data-category="${escapeHtml(category)}"
          aria-pressed="${category === activeCategory}"
          class="btn btn-sm whitespace-nowrap shrink-0 ${category === activeCategory ? 'btn-primary' : 'btn-outline'}"
        >
          ${escapeHtml(category)}
          <span class="badge badge-sm ${category === activeCategory ? 'badge-neutral' : 'badge-ghost'}">${category === 'All' ? certificates.length : counts[category]}</span>
        </button>
      `).join('');

      filterContainer.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => filterCertificates(btn.dataset.category));
      });
    }

    function filterCertificates(category) {
      activeCategory = category;
      filterContainer.querySelectorAll('button').forEach(btn => {
        const isActive = btn.dataset.category === category;
        btn.setAttribute('aria-pressed', isActive);
        btn.classList.toggle('btn-primary', isActive);
        btn.classList.toggle('btn-outline', !isActive);
        const badge = btn.querySelector('.badge');
        if (badge) {
          badge.classList.toggle('badge-neutral', isActive);
          badge.classList.toggle('badge-ghost', !isActive);
        }
      });
      applyFilters();
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFilters();
      });
    }

    function applyFilters() {
      const byCategory = activeCategory === 'All'
        ? allCertificates
        : allCertificates.filter(c => c.category === activeCategory);

      const q = searchQuery;
      const filtered = q
        ? byCategory.filter(c =>
            [c.title, c.issuer, c.category, ...((c.tags) || [])]
              .join(' ').toLowerCase().includes(q))
        : byCategory;

      renderCertificates(filtered);
    }

    function renderCertificates(certificates) {
      if (countEl) {
        const total = allCertificates.length;
        countEl.textContent = certificates.length === total
          ? `${total} certificates`
          : `${certificates.length} of ${total} certificates`;
      }

      if (!certificates.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16">
            <p class="text-lg font-semibold">No certificates found.</p>
            <p class="text-sm opacity-60 mt-1">Try a different search or category.</p>
            <button type="button" onclick="resetFilters()" class="btn btn-sm btn-outline mt-4">Clear filters</button>
          </div>`;
        return;
      }

      grid.innerHTML = certificates.map(cert => `
        <div class="card bg-base-100 shadow-sm border h-full flex flex-col overflow-hidden transition-all duration-200 hover:shadow-lg hover:-translate-y-1">
          <figure class="h-56 overflow-hidden shrink-0 flex items-center justify-center bg-base-200/50 p-3">
            <img src="${escapeHtml(cert.image_url)}" alt="${escapeHtml(cert.title)}" loading="lazy"
              onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"
              class="max-w-full max-h-full object-contain rounded-lg" />
          </figure>
          <div class="card-body flex flex-col flex-1 gap-2 p-5">
            <h2 class="card-title text-base leading-snug select-text">${escapeHtml(cert.title)}</h2>
            <div class="badge badge-outline badge-info badge-sm select-text">${escapeHtml(cert.category)}</div>
            <p class="text-sm opacity-70 select-text">Issued by ${escapeHtml(cert.issuer)}</p>

            <div class="flex flex-wrap gap-1.5 pt-1 select-text">
              ${(cert.tags || []).map(tag => `<span class="badge badge-sm badge-ghost">${escapeHtml(tag)}</span>`).join('')}
            </div>

            <div class="card-actions justify-end mt-auto pt-3">
              <a href="${escapeHtml(cert.view_url)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm text-white">
                View Certificate
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function resetFilters() {
      activeCategory = 'All';
      searchQuery = '';
      if (searchInput) searchInput.value = '';
      renderFilters(allCertificates);
      applyFilters();
    }
  </script>
</body>

</html>
